<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brain.</title>
<meta name="description" content="brain. — a quiet place for the things worth remembering.">
<style>
  :root {
    --paper:#f3f0e7;
    --paper2:#e9e4d8;
    --surface:#fffdf8;
    --ink:#181714;
    --soft:#6f6a5e;
    --faint:#9a9487;
    --line:#d9d2c3;
    --accent:#4438e0;
    --accentSoft:#ebe9fb;
    --teal:#2d7464;
    --amber:#a96e19;
    --danger:#a33a3a;
    --shadow:0 18px 50px rgba(24,20,12,.08);
    --serif:Georgia,"Times New Roman",serif;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  [data-theme="black"] {
    --paper:#0b0b0b;
    --paper2:#171714;
    --surface:#121210;
    --ink:#f6f2e9;
    --soft:#b5afa3;
    --faint:#8c867b;
    --line:#30302c;
    --accent:#948dff;
    --accentSoft:#282441;
    --teal:#78c7b0;
    --amber:#d3a15d;
    --danger:#ed9292;
    --shadow:0 22px 70px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input,textarea{font:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px}
  .sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

  /* welcome */
  .welcome {
    position:fixed; inset:0; z-index:1000; display:grid; place-items:center;
    background:rgba(243,240,231,.96);
    opacity:1; visibility:visible;
    transition:opacity .48s ease, visibility .48s ease;
  }
  [data-theme="black"] .welcome{background:rgba(11,11,11,.96)}
  .welcome.is-gone{opacity:0;visibility:hidden;pointer-events:none}
  .welcome-card{
    width:min(360px,calc(100vw - 36px));
    padding:26px 24px 22px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 24px 80px rgba(0,0,0,.13);
    text-align:center;
    animation:welcomeIn .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .mascot-wrap{width:112px;height:112px;margin:0 auto 10px;position:relative}
  .mascot-halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 10%,transparent),transparent 68%);animation:breathe 4.5s ease-in-out infinite}
  .mascot{
    position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.16));
    animation:float 4.8s ease-in-out infinite;
  }
  .hello{
    font:600 10px/1 var(--mono);letter-spacing:1.7px;text-transform:uppercase;color:var(--faint);
    margin-bottom:9px;
  }
  .welcome-card h1{font:500 35px/.95 var(--serif);letter-spacing:-1.7px;margin:0 0 10px}
  .welcome-card p{margin:0 auto 17px;max-width:260px;color:var(--soft);font-size:13px;line-height:1.6}
  .ok-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:40px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--paper);
    font-size:12px;font-weight:700;transition:transform .18s,opacity .18s;
  }
  .ok-btn:hover{transform:translateY(-1px);opacity:.92}
  @keyframes welcomeIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes breathe{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.04);opacity:1}}

  /* shell */
  .app{min-height:100vh}
  .topbar{
    max-width:1180px;margin:0 auto;padding:22px 26px 10px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--paper) 70%,transparent);
    backdrop-filter:blur(9px);
  }
  .brand{font:500 25px/1 var(--serif);font-style:italic;letter-spacing:-.9px}
  .brand .dot{color:var(--accent)}
  .top-actions{display:flex;gap:7px;align-items:center}
  .circle-btn{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    color:var(--soft);border:1px solid transparent;transition:background .18s,border-color .18s,transform .18s;
  }
  .circle-btn:hover{background:var(--paper2);border-color:var(--line);transform:translateY(-1px)}
  .add-btn{background:var(--accent);color:#fff;border-color:var(--accent)}
  .add-btn:hover{background:color-mix(in srgb,var(--accent) 90%,black)}
  .circle-btn svg{width:18px;height:18px}

  .layout{max-width:1180px;margin:0 auto;padding:0 26px 80px}
  .nav{display:flex;gap:4px;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:38px}
  .nav button{font-size:12px;color:var(--soft);padding:8px 12px;border-radius:8px}
  .nav button.active{color:var(--paper);background:var(--ink)}

  .view{display:none;animation:viewIn .3s ease both}
  .view.active{display:block}
  @keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  /* home */
  .home{max-width:960px;margin:0 auto}
  .home-intro{font-size:13px;color:var(--soft);max-width:410px;line-height:1.6;margin:0 0 20px}
  .hero-row{display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center;margin-bottom:62px}
  .hero-title{font:500 clamp(45px,6.2vw,78px)/.91 var(--serif);letter-spacing:-4px;margin:0 0 20px;max-width:650px}
  .hero-title em{font-style:italic;font-weight:400}
  .hero-copy{max-width:500px;color:var(--soft);font-size:15px;line-height:1.7}
  .quick-capture{display:flex;gap:8px;padding:6px;margin-top:24px;border:1px solid var(--line);border-radius:13px;background:var(--surface);box-shadow:var(--shadow)}
  .quick-capture input{flex:1;min-width:0;border:0;background:transparent;padding:11px 12px;outline:0;font-size:14px}
  .quick-capture button{min-height:42px;padding:0 15px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700}
  .mini-hint{margin-top:9px;color:var(--faint);font:500 10px/1.4 var(--mono)}
  .orb{aspect-ratio:1;max-width:360px;width:100%;margin:auto;position:relative;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,var(--accentSoft),transparent 60%)}
  .orb::before,.orb::after{content:"";position:absolute;border:1px solid color-mix(in srgb,var(--accent) 17%,transparent);border-radius:50%}
  .orb::before{inset:12%;animation:spin 26s linear infinite}
  .orb::after{inset:24%;border-style:dashed;opacity:.7;animation:spin 20s linear infinite reverse}
  .orb-core{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 32% 25%,var(--accent),color-mix(in srgb,var(--accent) 64%,black));box-shadow:0 18px 48px color-mix(in srgb,var(--accent) 24%,transparent),0 0 0 14px color-mix(in srgb,var(--accent) 7%,transparent);font:500 18px var(--serif)}
  .orb-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 9%,transparent);animation:drift 6s ease-in-out infinite}
  .od1{left:16%;top:29%} .od2{right:13%;top:40%;animation-delay:-2s} .od3{right:23%;bottom:18%;animation-delay:-3.4s} .od4{left:25%;bottom:14%;animation-delay:-1.4s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-6px)}}

  .section-title{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:17px}
  .eyebrow{font:600 9px/1 var(--mono);letter-spacing:1.7px;text-transform:uppercase;color:var(--faint)}
  h2{font:500 clamp(30px,4vw,44px)/1 var(--serif);letter-spacing:-1.7px;margin:7px 0 0}
  .muted{color:var(--soft);font-size:13px;line-height:1.6}
  .shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .shelf{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:19px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,border-color .2s}
  .shelf:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
  .shelf-top{display:flex;justify-content:space-between;gap:12px}
  .shelf-name{font:500 25px var(--serif);letter-spacing:-.6px}
  .count{font:600 9px var(--mono);color:var(--faint)}
  .shelf-desc{font-size:12px;color:var(--soft);line-height:1.55;max-width:250px}
  .recent{margin-top:55px}
  .recent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .memory-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:155px;display:flex;flex-direction:column;gap:11px;transition:transform .2s,border-color .2s,box-shadow .2s}
  .memory-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:0 14px 32px rgba(0,0,0,.05)}
  .card-type{font:600 9px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
  .card-text{font:500 18px/1.25 var(--serif);word-break:break-word}
  .card-meta{margin-top:auto;display:flex;justify-content:space-between;gap:10px;color:var(--faint);font-size:10px}

  /* memory */
  .memory-toolbar{display:flex;gap:8px;align-items:center;margin:16px auto 24px;max-width:960px}
  .search{flex:1;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:0 13px;outline:0}
  .filter{display:flex;gap:5px;flex-wrap:wrap}
  .pill{padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:10px;color:var(--soft);background:var(--surface)}
  .pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .archive{max-width:960px;margin:0 auto}
  .day{border-top:1px solid var(--line);padding:18px 0}
  .day-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .day-title{font:500 21px var(--serif)}
  .day-count{font:600 9px var(--mono);color:var(--faint)}
  .day-list{display:grid;margin-top:8px}
  .day-item{display:grid;grid-template-columns:90px 90px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent);align-items:start}
  .day-item time,.day-item .item-kind{font:600 9px var(--mono);color:var(--faint)}
  .day-item .item-kind{color:var(--accent)}
  .day-item a{font:500 17px var(--serif);line-height:1.35}

  /* collections */
  .collection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:960px;margin:auto}
  .collection{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:21px;min-height:150px}
  .collection h3{font:500 26px var(--serif);margin:13px 0 4px}
  .collection p{margin:0;color:var(--soft);font-size:12px}
  .collection-top{display:flex;justify-content:space-between}
  .collection-icon{font-size:18px}
  .new-collection{border-style:dashed;display:grid;place-items:center;color:var(--soft);text-align:center;cursor:pointer}
  .new-collection strong{display:block;font:500 22px var(--serif);color:var(--ink);margin-bottom:5px}

  /* explore */
  .explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:960px;margin:auto}
  .explore{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-height:180px;transition:transform .2s,border-color .2s}
  .explore:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
  .explore-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accentSoft);color:var(--accent);font:600 16px var(--mono)}
  .explore h3{font:500 28px var(--serif);margin:22px 0 6px}
  .explore p{margin:0;color:var(--soft);font-size:12px;line-height:1.6}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(17,15,11,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:500}
  .overlay.active{display:flex}
  .modal{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.2)}
  .modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .modal textarea{width:100%;min-height:190px;resize:vertical;border:0;outline:0;background:transparent;padding:15px 0;font:400 20px/1.55 var(--serif)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
  .primary{min-height:40px;padding:0 15px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700}
  .ghost{min-height:40px;padding:0 14px;border-radius:10px;color:var(--soft);font-size:12px}
  .type-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
  .type-row button{padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--soft);background:var(--surface)}
  .type-row button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* detail */
  .detail{max-width:740px;margin:auto}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-size:12px;margin-bottom:20px}
  .detail h2{font-size:50px;margin-bottom:16px}
  .detail-body{font:400 20px/1.6 var(--serif);padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .detail-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}

  /* toast */
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;z-index:700;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 14px;font-size:11px;transition:opacity .24s,transform .24s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:900px){
    .hero-row{grid-template-columns:1fr;gap:30px}
    .orb{max-width:310px}
    .shelves,.recent-grid,.explore-grid{grid-template-columns:1fr}
    .collection-grid{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .topbar{padding:16px 16px 8px}
    .layout{padding:0 16px 70px}
    .nav{overflow:auto}
    .nav button{white-space:nowrap}
    .hero-title{font-size:53px;letter-spacing:-3px}
    .quick-capture{flex-direction:column}
    .quick-capture button{width:100%}
    .memory-toolbar{flex-direction:column;align-items:stretch}
    .day-item{grid-template-columns:72px 72px minmax(0,1fr);gap:9px}
    .detail h2{font-size:42px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  }
</style>
</head>

  <div class="modal">
    <div class="modal-top">
      <div>
        <div class="eyebrow">capture</div>
        <h2 id="captureTitle" style="font-size:34px;margin:7px 0 0">Put something here.</h2>
        <p id="captureDescription" class="muted" style="margin:7px 0 0">Thought, idea, link, note — no sorting required.</p>
      </div>

    </div>

      <button type="button" data-type="idea">Idea</button>
      <button type="button" data-type="note">Note</button>

    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const state = {
    items: [],
    folders: [
      {id:"ideas",name:"Ideas",icon:"✦"},
      {id:"study",name:"Study",icon:"◆"},
      {id:"projects",name:"Projects",icon:"□"},
      {id:"personal",name:"Personal",icon:"○"}
    ],
    view:"home",
    filter:"all",
    theme: localStorage.getItem("manjusa-theme") === "black" ? "black" : "white",
    selectedType:"thought"
  };

  const els = {
    welcome: document.getElementById("welcome"),
    welcomeOk: document.getElementById("welcomeOk"),
    app: document.getElementById("appRoot"),
    nav: document.getElementById("nav"),
    home: document.getElementById("homeView"),
    memory: document.getElementById("memoryView"),
    collections: document.getElementById("collectionsView"),
    explore: document.getElementById("exploreView"),
    detail: document.getElementById("detailView"),
    add: document.getElementById("addBtn"),
    theme: document.getElementById("themeBtn"),
    overlay: document.getElementById("captureOverlay"),
    input: document.getElementById("captureInput"),
    close: document.getElementById("closeCapture"),
    cancel: document.getElementById("cancelCapture"),
    save: document.getElementById("saveCapture"),
    typeRow: document.getElementById("typeRow"),
    toast: document.getElementById("toast")
  };

  function escapeHtml(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function uid() {
    return (crypto && crypto.randomUUID) ? crypto.randomUUID() : "m_" + Date.now() + Math.random().toString(36).slice(2);
  }

  async function loadData() {
    try {
      if (window.storage && typeof window.storage.get === "function") {
        let res = await window.storage.get("manjusa-items", false);
        if (res && res.value) { state.items = JSON.parse(res.value); return; }
        // One-time compatibility with the earlier working title.
        res = await window.storage.get("tovra-items", false);
        if (res && res.value) state.items = JSON.parse(res.value);
        return;
      }
    } catch (_e) {}
    try {
      const saved = localStorage.getItem("manjusa-items") || localStorage.getItem("tovra-items");
      state.items = saved ? JSON.parse(saved) : [];
    } catch (_e) {
      state.items = [];
    }
  }

  async function saveData() {
    const json = JSON.stringify(state.items);
    try {
      if (window.storage && typeof window.storage.set === "function") {
        await window.storage.set("manjusa-items", json, false);
        return;
      }
    } catch (_e) {}
    localStorage.setItem("manjusa-items", json);
  }

  function saveTheme() {
    localStorage.setItem("manjusa-theme", state.theme);
    document.documentElement.dataset.theme = state.theme;
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"});
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  }

  function typeFor(value) {
    const t = value.toLowerCase();
    if (/^https?:\/\/(?:www\.)?(youtube\.com|youtu\.be)/i.test(value)) return "youtube";
    if (/^https?:\/\/(?:www\.)?instagram\.com/i.test(value)) return "instagram";
    if (/^https?:\/\//i.test(value)) return "website";
    if (/remind me|reminder/.test(t)) return "reminder";
    if (/study|jee|exam|chapter|learn/.test(t)) return "study";
    if (/^idea\b|idea:/i.test(value)) return "idea";
    if (/^note\b|note:/i.test(value)) return "note";
    return state.selectedType || "thought";
  }

  function addItem(raw) {
    const content = raw.trim();
    if (!content) return false;
    const type = typeFor(content);
    state.items.unshift({
      id:uid(), type, content,
      url: /^https?:\/\//i.test(content) ? content : null,
      title:null, meta:null, thumbnail:null,
      folder:null, connections:[],
      createdAt:Date.now()
    });
    saveData();
    render();
    toast("Saved. brain. will remember this.");
    return true;
  }

  function toast(message) {
    els.toast.textContent = message;
    els.toast.classList.add("show");
    clearTimeout(window.__manjusaToast);
    window.__manjusaToast = setTimeout(() => els.toast.classList.remove("show"), 2200);
  }

  function setView(view) {
    state.view = view;
    window.location.hash = view;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderNav() {
    const items = [
      ["home","Home"],["memory","Memory"],["collections","Collections"],["explore","Explore"]
    ];
    els.nav.innerHTML = items.map(([id,label]) =>
      `<button type="button" class="${state.view===id?"active":""}" aria-current="${state.view===id?"page":"false"}" data-view="${id}">${label}</button>`
    ).join("");
    els.nav.querySelectorAll("button").forEach(btn => btn.addEventListener("click",() => setView(btn.dataset.view)));
  }

  function shelfData() {
    const idea = state.items.filter(i=>i.type==="idea").length;
    const thought = state.items.filter(i=>i.type==="thought").length;
    const links = state.items.filter(i=>["website","youtube","instagram"].includes(i.type)).length;
    return [
      ["Ideas",idea,"things you want to make, try, or explore","idea"],
      ["Thoughts",thought,"things you want to hold onto","thought"],
      ["Saved links",links,"websites, videos, and references","links"]
    ];
  }

  function renderHome() {
    const shelves = shelfData();
    const recent = state.items.slice(0,3);
    els.home.innerHTML = `
      <div class="home">
        <div class="hero-row">
          <div>
            <div class="eyebrow">your second memory</div>
            <h1 class="hero-title" id="homeTitle">nothing worth keeping should <em>disappear.</em></h1>
            <p class="hero-copy">Drop in the thought, idea, link, or little thing you know you'll want again. brain. keeps it quiet until you need it.</p>
            <div class="quick-capture">
              <label class="sr" for="quickInput">What's on your mind?</label>
              <input id="quickInput" placeholder="What's on your mind?">
              <button type="button" id="quickSave">Put it in</button>
            </div>
            <div class="mini-hint">Try a thought, a link, or “remind me tomorrow…”</div>
          </div>
          <div class="orb" aria-label="A calm visual representing your memories becoming connected">
            <div class="orb-core">brain.</div>
            <span class="orb-dot od1" aria-hidden="true"></span><span class="orb-dot od2" aria-hidden="true"></span>
            <span class="orb-dot od3" aria-hidden="true"></span><span class="orb-dot od4" aria-hidden="true"></span>
          </div>
        </div>

        <section aria-labelledby="homesHeading">
          <div class="section-title">
            <div><div class="eyebrow">your memory, naturally organized</div><h2 id="homesHeading">Everything has a place.</h2></div>
            <div class="muted">${state.items.length ? `${state.items.length} saved` : "your first memory is waiting"}</div>
          </div>
          <div class="shelves">
            ${shelves.map(([name,count,desc,key]) => `
              <button class="shelf" type="button" data-filter="${key}">
                <div class="shelf-top"><span class="shelf-name">${name}</span><span class="count">${count}</span></div>
                <span class="shelf-desc">${desc}</span>
              </button>`).join("")}
          </div>
        </section>

        <section class="recent" aria-labelledby="recentHeading">
          <div class="section-title">
            <div><div class="eyebrow">recently kept</div><h2 id="recentHeading">A few things you saved.</h2></div>
            <button class="ghost" type="button" id="openMemory">Open memory ↗</button>
          </div>
          ${recent.length ? `<div class="recent-grid">${recent.map(memoryCard).join("")}</div>` :
            `<div class="empty" style="padding:55px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--soft)">Your first memory belongs here. Put something in above.</div>`}
        </section>
      </div>`;
    document.getElementById("quickSave").addEventListener("click", () => {
      const input = document.getElementById("quickInput");
      if (addItem(input.value)) input.value = "";
    });
    document.getElementById("quickInput").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const input = e.currentTarget;
        if (addItem(input.value)) input.value = "";
      }
    });
    document.getElementById("openMemory").addEventListener("click", () => setView("memory"));
    els.home.querySelectorAll(".shelf").forEach(btn => btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      setView("memory");
    }));
    els.home.querySelectorAll("[data-memory]").forEach(el => el.addEventListener("click", e => {
      e.preventDefault(); openDetail(el.dataset.memory);
    }));
  }

  function memoryCard(item) {
    return `<a class="memory-card" href="#memory-${item.id}" data-memory="${escapeHtml(item.id)}">
      <div class="card-type">${escapeHtml(item.type)}</div>
      <div class="card-text">${escapeHtml(item.content.slice(0,170))}</div>
      <div class="card-meta"><span>${formatDate(item.createdAt)}</span><span>${item.folder ? escapeHtml(item.folder) : "Unsorted"}</span></div>
    </a>`;
  }

  function filterItems(query="") {
    let items = [...state.items];
    if (state.filter === "idea") items = items.filter(i=>i.type==="idea");
    if (state.filter === "thought") items = items.filter(i=>i.type==="thought");
    if (state.filter === "links") items = items.filter(i=>["website","youtube","instagram"].includes(i.type));
    if (state.filter === "study") items = items.filter(i=>i.type==="study");
    if (state.filter === "reminder") items = items.filter(i=>i.type==="reminder");
    const q = query.trim().toLowerCase();
    if (q) items = items.filter(i => `${i.content} ${i.type} ${i.folder||""}`.toLowerCase().includes(q));
    return items.sort((a,b)=>b.createdAt-a.createdAt);
  }

  function renderMemory(query="") {
    const items = filterItems(query);
    const groups = {};
    items.forEach(i => {
      const d = formatDate(i.createdAt);
      (groups[d] ||= []).push(i);
    });
    els.memory.innerHTML = `
      <div class="section-title" style="max-width:960px;margin:0 auto">
        <div><div class="eyebrow">memory</div><h2 id="memoryTitle">Your saved world.</h2><div class="muted">Nothing here disappears. It just gets quieter.</div></div>
        <div class="muted">${items.length} / ${state.items.length}</div>
      </div>
      <div class="memory-toolbar">
        <label class="sr" for="memorySearch">Search your memory</label>
        <input class="search" id="memorySearch" value="${escapeHtml(query)}" placeholder="Search your memory…">
        <div class="filter" aria-label="Memory filters">
          ${[["all","All"],["idea","Ideas"],["thought","Thoughts"],["links","Links"],["study","Study"],["reminder","Reminders"]].map(([v,l])=>`<button class="pill ${state.filter===v?"active":""}" type="button" data-filter="${v}" aria-pressed="${state.filter===v}">${l}</button>`).join("")}
        </div>
      </div>
      <div class="archive">
        ${Object.keys(groups).length ? Object.entries(groups).map(([date,arr]) => `
          <section class="day" aria-labelledby="day-${date.replace(/\W/g,"")}">
            <div class="day-head"><h3 class="day-title" id="day-${date.replace(/\W/g,"")}">${escapeHtml(date)}</h3><span class="day-count">${arr.length}</span></div>
            <div class="day-list">
              ${arr.map(i => `<div class="day-item">
                <time datetime="${new Date(i.createdAt).toISOString()}">${formatTime(i.createdAt)}</time>
                <span class="item-kind">${escapeHtml(i.type)}</span>
                <a href="#memory-${i.id}" data-memory="${escapeHtml(i.id)}">${escapeHtml(i.content.slice(0,220))}</a>
              </div>`).join("")}
            </div>
          </section>`).join("") :
          `<div style="padding:65px 20px;text-align:center;color:var(--soft)"><div style="font:500 28px var(--serif);color:var(--ink);margin-bottom:7px">Your memory is quiet.</div>Try another search, or save something new.</div>`}
      </div>`;
    const search = document.getElementById("memorySearch");
    search.addEventListener("input", e => renderMemory(e.target.value));
    els.memory.querySelectorAll(".pill").forEach(btn => btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      renderMemory(search.value);
    }));
    els.memory.querySelectorAll("[data-memory]").forEach(el => el.addEventListener("click", e => {
      e.preventDefault(); openDetail(el.dataset.memory);
    }));
  }

  function renderCollections() {
    const collections = state.folders;
    els.collections.innerHTML = `
      <div class="section-title" style="max-width:960px;margin:0 auto 20px">
        <div><div class="eyebrow">collections</div><h2 id="collectionsTitle">Homes, not chores.</h2><div class="muted">Optional places for things that naturally belong together.</div></div>
      </div>
      <div class="collection-grid">
        ${collections.map(f => {
          const n = state.items.filter(i=>i.folder===f.name).length;
          return `<div class="collection"><div class="collection-top"><span class="collection-icon" aria-hidden="true">${f.icon}</span><span class="count">${n}</span></div><h3>${escapeHtml(f.name)}</h3><p>${n===1?"1 memory":"".concat(n," memories")}</p></div>`;
        }).join("")}
        <button class="collection new-collection" type="button" id="newCollection"><div><strong>+ New collection</strong><span>Make a home for related things</span></div></button>
      </div>`;
    document.getElementById("newCollection").addEventListener("click", () => {
      const name = prompt("Collection name");
      if (!name || !name.trim()) return;
      state.folders.push({id:uid(),name:name.trim(),icon:"□"});
      toast("Collection created.");
      renderCollections();
    });
  }

  function renderExplore() {
    els.explore.innerHTML = `
      <div class="section-title" style="max-width:960px;margin:0 auto 20px">
        <div><div class="eyebrow">explore</div><h2 id="exploreTitle">Let your memory breathe.</h2><div class="muted">The deeper part appears naturally as you save more.</div></div>
      </div>
      <div class="explore-grid">
        <button class="explore" type="button" id="connections">
          <span class="explore-icon" aria-hidden="true">◌</span>
          <h3>Connections</h3><p>See how separate memories start touching.</p>
        </button>
        <button class="explore" type="button" id="rediscover">
          <span class="explore-icon" aria-hidden="true">✦</span>
          <h3>Rediscover</h3><p>Bring an older thought back into the room.</p>
        </button>
        <button class="explore" type="button" id="reflect">
          <span class="explore-icon" aria-hidden="true">✎</span>
          <h3>Reflect</h3><p>Look back at what kept returning to your mind.</p>
        </button>
      </div>
      <div id="exploreResult" style="max-width:960px;margin:20px auto 0"></div>`;
    document.getElementById("connections").addEventListener("click", () => showConnections());
    document.getElementById("rediscover").addEventListener("click", () => showRediscover());
    document.getElementById("reflect").addEventListener("click", () => showReflect());
  }

  function showConnections() {
    const source = state.items.slice(0,8);
    const box = document.getElementById("exploreResult");
    if (!source.length) {
      box.innerHTML = `<div class="empty" style="padding:50px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--soft)">Save a few memories first. Then your universe has something to work with.</div>`;
      return;
    }
    box.innerHTML = `<div class="collection" style="min-height:260px;background:radial-gradient(circle at 50% 50%,var(--accentSoft),transparent 55%),var(--surface);position:relative;overflow:hidden">
      <div style="text-align:center;margin-bottom:18px"><div class="eyebrow">your universe</div><div style="font:500 29px var(--serif);margin-top:6px">Everything you keep can touch.</div></div>
      <div style="height:150px;position:relative;display:grid;place-items:center">
        <div style="width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font:500 15px var(--serif);box-shadow:0 16px 38px color-mix(in srgb,var(--accent) 25%,transparent)">you</div>
        ${source.map((i,idx) => {
          const a = (idx/source.length)*Math.PI*2;
          const x = 50 + Math.cos(a)*34, y = 50 + Math.sin(a)*34;
          return `<span style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 8%,transparent)" title="${escapeHtml(i.type)}"></span>`;
        }).join("")}
      </div>
      <p class="muted" style="text-align:center;max-width:520px;margin:0 auto">The visual is only a map. The useful part is being able to follow a memory to another one.</p>
    </div>`;
  }

  function showRediscover() {
    const box = document.getElementById("exploreResult");
    if (!state.items.length) {
      box.innerHTML = `<div class="empty" style="padding:50px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--soft)">Save something first. Old things become interesting after time.</div>`;
      return;
    }
    const oldest = [...state.items].sort((a,b)=>a.createdAt-b.createdAt)[0];
    box.innerHTML = `<div class="collection" style="min-height:200px"><div class="eyebrow">from another time</div><div style="font:500 30px var(--serif);margin:11px 0 12px">You saved this ${Math.max(1,Math.floor((Date.now()-oldest.createdAt)/86400000))} days ago.</div><div style="font:400 19px/1.55 var(--serif)">${escapeHtml(oldest.content)}</div><button class="primary" style="margin-top:18px" id="rediscoverOpen">Open memory ↗</button></div>`;
    document.getElementById("rediscoverOpen").addEventListener("click", () => openDetail(oldest.id));
  }

  function showReflect() {
    const box = document.getElementById("exploreResult");
    box.innerHTML = `<div class="collection"><div class="eyebrow">reflect</div><div style="font:500 29px var(--serif);margin:9px 0 10px">What kept coming back?</div><p class="muted">A few minutes. No score. No streak. Just enough space to notice what mattered.</p><label class="sr" for="reflection">Your reflection</label><textarea id="reflection" style="width:100%;min-height:150px;margin-top:15px;border:0;outline:0;background:transparent;resize:vertical;font:400 19px/1.55 var(--serif)" placeholder="Write whatever stands out…"></textarea><button class="primary" style="margin-top:12px" id="saveReflection">Save reflection</button></div>`;
    document.getElementById("saveReflection").addEventListener("click", () => {
      localStorage.setItem("manjusa-reflection", document.getElementById("reflection").value);
      toast("Reflection saved.");
    });
  }

  function openDetail(id) {
    const item = state.items.find(i => i.id === id);
    if (!item) return;
    state.view = "detail";
    renderNav();
    [els.home,els.memory,els.collections,els.explore].forEach(v=>v.classList.remove("active"));
    els.detail.classList.add("active");
    els.detail.innerHTML = `
      <div class="detail">
        <a class="back" href="#memory" id="detailBack">← back to memory</a>
        <div class="eyebrow">${escapeHtml(item.type)} · ${formatDate(item.createdAt)}</div>
        <h2>Memory</h2>
        <div class="detail-body">${escapeHtml(item.content)}</div>
        <div class="detail-actions">
          <button class="primary" type="button" id="organizeBtn">Organize memory</button>
          <button class="ghost" type="button" id="remindBtn">Set reminder</button>
          <button class="ghost" type="button" id="deleteBtn">Delete memory</button>
        </div>
      </div>`;
    document.getElementById("detailBack").addEventListener("click",e=>{e.preventDefault();setView("memory")});
    document.getElementById("organizeBtn").addEventListener("click",()=>{
      const options = state.folders.map(f=>f.name).join(", ");
      const name = prompt(`Collection name. Existing: ${options}`);
      if (!name || !name.trim()) return;
      item.folder = name.trim();
      if (!state.folders.some(f=>f.name===item.folder)) state.folders.push({id:uid(),name:item.folder,icon:"□"});
      saveData(); toast("Organized."); openDetail(id);
    });
    document.getElementById("remindBtn").addEventListener("click",()=>{
      const reminder = prompt("When should I remind you? Example: tomorrow at 7 PM");
      if (!reminder) return;
      item.reminder = reminder;
      saveData(); toast("Reminder saved locally.");
    });
    document.getElementById("deleteBtn").addEventListener("click",()=>{
      if (!confirm("Delete this memory?")) return;
      state.items = state.items.filter(i=>i.id!==id);
      saveData(); toast("Memory deleted."); setView("memory");
    });
  }

  function render() {
    renderNav();
    [els.home,els.memory,els.collections,els.explore,els.detail].forEach(v=>v.classList.remove("active"));
    if (state.view==="home") { els.home.classList.add("active"); renderHome(); }
    else if (state.view==="memory") { els.memory.classList.add("active"); renderMemory(""); }
    else if (state.view==="collections") { els.collections.classList.add("active"); renderCollections(); }
    else if (state.view==="explore") { els.explore.classList.add("active"); renderExplore(); }
    else if (state.view==="detail") els.detail.classList.add("active");
  }

  function openCapture() {
    els.overlay.classList.add("active");
    els.input.value="";
    state.selectedType="thought";
    els.typeRow.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.type==="thought"));
    setTimeout(()=>els.input.focus(),40);
  }
  function closeCapture() {
    els.overlay.classList.remove("active");
  }

  els.add.addEventListener("click",openCapture);
  els.close.addEventListener("click",closeCapture);
  els.cancel.addEventListener("click",closeCapture);
  els.overlay.addEventListener("click",e=>{if(e.target===els.overlay)closeCapture()});
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      if(els.overlay.classList.contains("active")) closeCapture();
      else if(!els.welcome.classList.contains("is-gone")) finishWelcome();
    }
    if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&els.overlay.classList.contains("active")){
      if(addItem(els.input.value)) closeCapture();
    }
    if(e.key==="n"&&!e.ctrlKey&&!e.metaKey&&!["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)&&els.welcome.classList.contains("is-gone")) openCapture();
  });
  els.save.addEventListener("click",()=>{if(addItem(els.input.value))closeCapture()});
  els.typeRow.addEventListener("click",e=>{
    const btn=e.target.closest("button"); if(!btn)return;
    state.selectedType=btn.dataset.type;
    els.typeRow.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b===btn));
  });
  els.theme.addEventListener("click",()=>{
    state.theme = state.theme==="black" ? "white" : "black";
    saveTheme(); toast(`Theme: ${state.theme==="black"?"Black":"White"}`);
  });

  function finishWelcome() {
    els.welcome.classList.add("is-gone");
    els.app.setAttribute("aria-hidden","false");
    setTimeout(()=>document.getElementById("quickInput")?.focus(),120);
  }
  els.welcomeOk.addEventListener("click",finishWelcome);

  window.addEventListener("hashchange",()=>{
    const h=location.hash.slice(1);
    if(["home","memory","collections","explore"].includes(h)){ state.view=h; render(); }
  });

  (async function init() {
    document.documentElement.dataset.theme=state.theme;
    await loadData();
    const h=location.hash.slice(1);
    state.view=["home","memory","collections","explore"].includes(h)?h:"home";
    render();
  })();
})();
</script>
</body>
</html>
